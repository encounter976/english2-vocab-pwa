  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
  <title>英语（二）AI 单词本 V4.1</title>
  <style>

  --bg:#f6f7fb;--card:#fff;--text:#20242c;--muted:#7a8291;--line:#e8eaf0;

.primary,.secondary,.danger-btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff;box-shadow:0 8px 18px rgba(37,56,91,.2)}.secondary{background:var(--accent-soft);color:var(--accent)}.danger-btn{background:#fff0f0;color:var(--danger);border:1px solid #f1d5d7}.compact{padding:12px 16px;white-space:nowrap}.wide{width:100%}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.metric-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;text-align:left;cursor:pointer}.metric-card strong{display:block;font-size:25px}.metric-card span{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.section-block{margin-top:20px}.section-block.no-top{margin-top:4px}.section-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.section-heading.stacked{align-items:flex-start;flex-direction:column;gap:5px}.section-heading h2{margin:0;font-size:18px}.section-heading p{margin:0;line-height:1.6}.text-btn{border:0;background:transparent;color:var(--accent);font-weight:700;cursor:pointer;padding:8px}
.word-list{display:flex;flex-direction:column;gap:10px}.word-list.roomy{margin-top:14px}.word-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 16px;cursor:pointer;gap:12px}.word-main{min-width:0}.word-main strong{display:block;font-size:17px}.word-main small{display:block;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}.word-side{text-align:right;flex-shrink:0}.badge{display:inline-block;font-size:11px;font-weight:800;padding:5px 8px;background:var(--accent-soft);color:var(--accent);border-radius:999px}.tiny{font-size:11px}.empty-line{padding:24px 8px;text-align:center;color:var(--muted)}
.add-form{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}.field-label{display:block;font-size:13px;font-weight:700;margin:0 0 8px}.input-row{display:flex;gap:9px}.word-input,.plain-input,.note-input{width:100%;border:1px solid #dfe3ea;background:#fafbfc;color:var(--text);border-radius:14px;padding:13px 14px;outline:none}.word-input{font-size:18px}.word-input:focus,.plain-input:focus,.note-input:focus{border-color:#9aa8bf;background:#fff}.optional-row{margin-top:10px}.status-line{min-height:24px;padding:9px 4px 0;color:var(--accent);font-size:13px;line-height:1.6}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(620px,100%);height:74px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:20;backdrop-filter:blur(12px)}.tab{border:0;background:transparent;color:#8b93a1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}.tab span{font-size:20px}.tab em{font-style:normal;font-size:11px}.tab.active{color:var(--accent);font-weight:800}.add-tab span{background:var(--accent);color:#fff;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;margin-top:-18px;box-shadow:0 8px 16px rgba(37,56,91,.22)}
.search-wrap{margin-bottom:10px}.search{font-size:15px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;color:var(--muted);white-space:nowrap;cursor:pointer}.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.review-wrap{padding-top:2px}.review-progress{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin-bottom:12px}.review-progress>div{height:7px;background:#e8ebf0;border-radius:999px;flex:1;overflow:hidden}.review-progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:.3s}.flash-card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:var(--shadow);min-height:520px;display:flex;flex-direction:column}.word-meta-line{display:flex;justify-content:space-between;align-items:center;gap:12px}.review-word{font-size:42px;font-weight:850;text-align:center;margin:76px 0 12px;word-break:break-word}.speak-btn{align-self:center;border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:9px 13px;font-weight:700;cursor:pointer}.answer-area{margin-top:28px}.phonetic{color:#6d7584;font-size:15px;margin-bottom:12px}.meaning{font-size:21px;font-weight:750;line-height:1.55;white-space:pre-line}.example-box{white-space:pre-line;margin-top:15px;border-left:3px solid #cad3e1;background:#f7f9fc;padding:12px 14px;border-radius:0 12px 12px 0;line-height:1.65;color:#4f5867}.note-box{margin-top:12px;background:#fff8e8;border:1px solid #f2e4ba;border-radius:12px;padding:12px 14px;line-height:1.6;white-space:pre-line}.source-sentence{margin-top:12px;background:#eef7f2;border:1px solid #d7eadf;border-radius:12px;padding:12px 14px;line-height:1.6}.flash-card>.primary{margin-top:auto}.rating-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:auto}.rating-grid button{border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px 8px;cursor:pointer}.rating-grid strong{display:block}.rating-grid span{display:block;font-size:11px;color:var(--muted);margin-top:3px}.empty-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:44px 24px;text-align:center;box-shadow:var(--shadow)}.empty-card .empty-icon{font-size:40px}.empty-card h2{margin-bottom:8px}.empty-card p{color:var(--muted);line-height:1.6}
.stat-hero{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}.stat-hero>div{background:var(--accent);color:#fff;border-radius:20px;padding:19px}.stat-hero span{display:block;font-size:12px;opacity:.75}.stat-hero strong{display:block;font-size:23px;margin-top:6px}.stats-list{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.stats-list>div{display:flex;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}.stats-list>div:last-child{border:0}
.detail-wrap{padding-top:2px}.back-btn{padding-left:0;margin-bottom:8px}.detail-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}.detail-title-row{display:flex;justify-content:space-between;align-items:center;gap:10px}.detail-title-row h2{font-size:35px;margin:26px 0 6px;word-break:break-word}.detail-meaning{font-size:20px;line-height:1.55;font-weight:750;white-space:pre-line}.ai-panel{margin-top:14px;background:#f7f9fc;border:1px solid var(--line);border-radius:16px;padding:14px}.ai-panel h3{font-size:13px;margin:0 0 8px;color:var(--muted)}.ai-panel p{margin:0;line-height:1.7;white-space:pre-line}.ai-list{margin:0;padding-left:18px;line-height:1.75}.ai-tag{display:inline-block;font-size:11px;font-weight:800;padding:5px 8px;background:#eef7f2;color:#2f6b4f;border-radius:999px;margin-left:6px}.ai-tag.warn{background:#fff4e8;color:#8b5c22}.config-box{background:#f8f9fb;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}.config-status{font-size:12px;line-height:1.6;margin-top:8px}.config-status.ok{color:var(--ok)}.config-status.bad{color:var(--danger)}.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.data-grid>div{background:#f8f9fb;border-radius:14px;padding:12px}.data-grid span{display:block;font-size:11px;color:var(--muted)}.data-grid strong{display:block;margin-top:5px;font-size:13px;word-break:break-all}.note-input{resize:vertical;line-height:1.6}.detail-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.detail-actions>*{flex:1;min-width:120px}.settings-group{display:flex;flex-direction:column;gap:10px;margin:22px 0}.file-label{text-align:center;cursor:pointer}.file-label input{display:none}.footnote{font-size:12px;color:var(--muted);line-height:1.6}
.scan-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow)}.scan-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.preview-box{margin-top:14px;border:1px dashed #ced7e3;border-radius:16px;overflow:hidden;background:#fbfcfe}.preview-box img{display:block;width:100%;height:auto}.scan-status{font-size:13px;line-height:1.6;color:var(--accent);margin-top:10px;min-height:22px}.sentence-list{display:flex;flex-direction:column;gap:12px;margin-top:14px}.sentence-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.sentence-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}.sentence-text{line-height:1.9}.scan-word{display:inline-block;border:1px solid #dfe5ef;background:#fff;border-radius:10px;padding:4px 8px;margin:2px 4px 2px 0;cursor:pointer}.scan-word:hover{background:var(--accent-soft);border-color:#c6d4ea}.scan-source-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media(max-width:380px){.review-word{font-size:35px}.hero-card{padding:20px}.big-number{font-size:46px}.input-row{flex-direction:column}.compact{width:100%}}
  </style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div>
      <div class="eyebrow">00015 英语（二）</div>
      <h1 id="pageTitle">真题单词本</h1>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="设置">⚙️</button>
  </header>
  <main id="app"></main>
  <nav class="tabbar" aria-label="主导航">
    <button class="tab active" data-route="home"><span>⌂</span><em>首页</em></button>
    <button class="tab" data-route="words"><span>▤</span><em>单词</em></button>
    <button class="tab add-tab" data-route="add"><span>＋</span><em>加词</em></button>
    <button class="tab" data-route="review"><span>↻</span><em>复习</em></button>
    <button class="tab" data-route="stats"><span>◔</span><em>统计</em></button>
  </nav>
</div>

<template id="homeTpl">
  <section class="hero-card">
    <div>
      <p class="muted">今天继续把真题里的陌生词变成熟词 🌱</p>
      <div class="big-number" id="dueCount">0</div>
      <div class="big-label">今日待复习</div>
    </div>
    <button class="primary" data-go="review">开始复习</button>
  </section>
  <section class="mini-grid">
    <button class="metric-card" data-go="add"><strong id="todayAdded">0</strong><span>今日新增</span></button>
    <button class="metric-card" data-go="scan"><strong id="scannedCount">0</strong><span>拍照识词</span></button>
    <button class="metric-card" data-filter="stubborn"><strong id="stubbornCount">0</strong><span>顽固词</span></button>
    <button class="metric-card" data-filter="mastered"><strong id="masteredCount">0</strong><span>已掌握</span></button>
  </section>
  <section class="section-block">
    <div class="section-heading">
      <h2>最近加入</h2>
      <button class="text-btn" data-go="words">查看全部</button>
    </div>
    <div id="recentWords" class="word-list"></div>
  </section>
</template>

<template id="addTpl">
  <section class="section-block no-top">
    <div class="section-heading stacked">
      <div>
        <div class="eyebrow">刷题时只管收词</div>
        <h2>快速添加</h2>
      </div>
      <p class="muted">手动输入适合快速连续收词；也可以直接拍手写单词、单词表或试卷，让 AI 只识别其中的英文单词。</p>
    </div>
    <div class="scan-actions" style="margin-bottom:14px">
      <button class="secondary" data-go="scan">📷 拍照识别单词</button>
    </div>
    <form id="quickAddForm" class="add-form">
      <label class="field-label" for="wordInput">英文单词</label>
      <div class="input-row">
        <input id="wordInput" class="word-input" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="例如 circumstance" />
        <button class="primary compact" type="submit">＋ 添加</button>
      </div>
      <div class="optional-row">
        <input id="sourceInput" class="plain-input" placeholder="来源（可选）：如 2025年10月 阅读2" />
      </div>
    </form>
    <div id="addMessage" class="status-line" aria-live="polite"></div>
    <div class="footnote">AI 补全和扫描识别需要联网并先在“设置”中填写 DeepSeek API Key；保存单词、笔记、复习和统计均在本机完成。</div>
  </section>
  <section class="section-block">
    <div class="section-heading"><h2>刚刚添加</h2></div>
    <div id="latestAdded" class="word-list"></div>
  </section>
</template>

<template id="scanTpl">
  <section class="detail-wrap">
    <button id="scanBackBtn" class="text-btn back-btn">← 返回</button>
    <article class="scan-card">
      <div class="section-heading stacked" style="margin-bottom:12px">
        <div>
          <div class="eyebrow">DeepSeek Vision</div>
          <h2>拍照识别单词</h2>
        </div>
        <p class="muted">可以拍手写单词、纸上的单词表或整张试卷。AI 只返回识别到的英文单词，不分析句子；点需要记忆的词即可加入。</p>
      </div>
      <label class="field-label" for="scanSourceInput">来源备注（可选）</label>
      <input id="scanSourceInput" class="plain-input" placeholder="例如 手写笔记 / 2025年10月真题" />
      <div class="scan-actions">
        <label class="secondary file-label">📷 拍照/选图<input id="scanFileInput" type="file" accept="image/*" capture="environment" /></label>
        <button id="runScanBtn" class="primary" type="button">识别单词</button>
      </div>
      <div id="scanStatus" class="scan-status">先拍照或选择一张包含英文单词的图片。</div>
      <div id="scanPreviewWrap" class="preview-box hidden"><img id="scanPreview" alt="真题预览" /></div>
    </article>

    <section id="scanResultWrap" class="section-block hidden">
      <div class="section-heading stacked">
        <div>
          <h2>识别到的单词</h2>
        </div>
        <p class="muted">只显示图片里识别到的英文单词。点需要记忆的词即可加入词库；已收录的词会直接提示。</p>
      </div>
      <div id="scanResultMeta" class="footnote"></div>
      <div id="scanWordList" class="sentence-list"></div>
    </section>
  </section>
</template>

<template id="wordsTpl">
  <section class="section-block no-top">
    <div class="search-wrap">
      <input id="searchInput" class="plain-input search" placeholder="搜索单词、释义或笔记" />
    </div>
    <div class="chips" id="filterChips">
      <button class="chip active" data-filter="all">全部</button>
      <button class="chip" data-filter="learning">学习中</button>
      <button class="chip" data-filter="stubborn">顽固词</button>
      <button class="chip" data-filter="mastered">已掌握</button>
      <button class="chip" data-filter="scanned">扫描词</button>
    </div>
    <div id="allWords" class="word-list roomy"></div>
  </section>
</template>

<template id="reviewTpl">
  <section class="review-wrap">
    <div class="review-progress"><span id="reviewProgressText">0 / 0</span><div><i id="reviewProgressBar"></i></div></div>
    <div id="reviewEmpty" class="empty-card hidden">
      <div class="empty-icon">✓</div>
      <h2>今天到这里</h2>
      <p>当前没有到期单词。可以去真题里继续收词。</p>
      <div class="scan-actions" style="justify-content:center">
        <button class="primary" data-go="add">去添加单词</button>
        <button class="secondary" data-go="scan">扫描真题</button>
      </div>
    </div>
    <article id="reviewCard" class="flash-card hidden">
      <div class="word-meta-line"><span id="reviewStatusBadge" class="badge">学习中</span><span id="reviewSource" class="muted tiny"></span></div>
      <div id="reviewWord" class="review-word">word</div>
      <button id="speakBtn" class="speak-btn">🔊 发音</button>
      <div id="answerArea" class="answer-area hidden">
        <div id="reviewPhonetic" class="phonetic"></div>
        <div id="reviewMeaning" class="meaning"></div>
        <div id="reviewExample" class="example-box"></div>
        <div id="reviewSentence" class="source-sentence hidden"></div>
        <div id="reviewNote" class="note-box hidden"></div>
      </div>
      <button id="showAnswerBtn" class="primary wide">显示答案</button>
      <div id="ratingBtns" class="rating-grid hidden">
        <button data-rating="again"><strong>不会</strong><span>很快再来</span></button>
        <button data-rating="hard"><strong>模糊</strong><span>间隔较短</span></button>
        <button data-rating="good"><strong>认识</strong><span>正常安排</span></button>
        <button data-rating="easy"><strong>很熟</strong><span>间隔更长</span></button>
      </div>
    </article>
  </section>
</template>

<template id="statsTpl">
  <section class="section-block no-top">
    <div class="stat-hero">
      <div><span>连续学习</span><strong id="streakDays">0 天</strong></div>
      <div><span>累计复习</span><strong id="reviewTotal">0 次</strong></div>
    </div>
    <div class="section-heading"><h2>学习概况</h2></div>
    <div class="stats-list">
      <div><span>单词总数</span><strong id="sTotal">0</strong></div>
      <div><span>学习中</span><strong id="sLearning">0</strong></div>
      <div><span>已掌握</span><strong id="sMastered">0</strong></div>
      <div><span>顽固词</span><strong id="sStubborn">0</strong></div>
      <div><span>扫描添加</span><strong id="sScanned">0</strong></div>
      <div><span>今日新增</span><strong id="sTodayAdded">0</strong></div>
      <div><span>今日复习</span><strong id="sTodayReviewed">0</strong></div>
    </div>
  </section>
</template>

<template id="detailTpl">
  <section class="detail-wrap">
    <button id="backBtn" class="text-btn back-btn">← 返回</button>
    <article class="detail-card">
      <div class="word-meta-line"><span id="detailBadge" class="badge"></span><span id="detailDate" class="muted tiny"></span></div>
      <div class="detail-title-row"><h2 id="detailWord"></h2><button id="detailSpeak" class="icon-btn">🔊</button></div>
      <div id="detailPhonetic" class="phonetic"></div>
      <div id="detailMeaning" class="detail-meaning"></div>
      <div id="detailExamMeaning" class="ai-panel hidden"><h3>⭐ 英语（二）优先记</h3><p id="detailExamText"></p></div>
      <div id="detailLemma" class="ai-panel hidden"><h3>词形 / 原形</h3><p id="detailLemmaText"></p></div>
      <div id="detailSourceSentencePanel" class="ai-panel hidden"><h3>真题原句</h3><p id="detailSourceSentence"></p></div>
      <div id="detailCollocations" class="ai-panel hidden"><h3>常见搭配</h3><ul id="detailCollocationList" class="ai-list"></ul></div>

<script>
const DB_KEY='english2_vocab_v21';
const OLD_DB_KEY='english2_vocab_v2';
const CONFIG_KEY='english2_ai_direct_config_v4';
const app=document.getElementById('app');
const pageTitle=document.getElementById('pageTitle');
let currentRoute='home';
let currentFilter='all';
let selectedWordId=null;
let reviewQueue=[];let reviewIndex=0;
let scanState={imageData:'', imageName:'', source:'', result:null};

const starterLexicon={
  circumstance:{phonetic:'/ˈsɜːrkəmstæns/',meaning:'n. 情况；情形；环境',examMeaning:'情况；情形',lemma:'circumstance',partOfSpeech:['n.'],collocations:[{phrase:'under no circumstances',meaning:'决不；无论如何不'}],example:'Under no circumstances should you give up.\n任何情况下你都不应该放弃。',wordFamily:[],memoryTip:'常见搭配 under no circumstances 表示“决不”。',aiStatus:'sample'},
  sufficient:{phonetic:'/səˈfɪʃənt/',meaning:'adj. 足够的；充分的',examMeaning:'足够的；充分的',lemma:'sufficient',partOfSpeech:['adj.'],collocations:[{phrase:'be sufficient to do',meaning:'足以做……'}],example:'The evidence is sufficient to support the conclusion.\n这些证据足以支持这一结论。',wordFamily:['sufficiently','insufficient'],memoryTip:'常见结构：be sufficient to do sth.',aiStatus:'sample'},
  apparent:{phonetic:'/əˈpærənt/',meaning:'adj. 明显的；显而易见的；表面上的',examMeaning:'明显的；显而易见的',lemma:'apparent',partOfSpeech:['adj.'],collocations:[{phrase:'it is apparent that...',meaning:'显然……'}],example:'It became apparent that the plan needed to change.\n很明显，这个计划需要改变。',wordFamily:['apparently'],memoryTip:'apparently 常表示“显然；看来”。',aiStatus:'sample'},
  concern:{phonetic:'/kənˈsɜːrn/',meaning:'n. 担忧；关心的事；v. 涉及；使担忧',examMeaning:'担忧；涉及；关心',lemma:'concern',partOfSpeech:['n.','v.'],collocations:[{phrase:'be concerned about',meaning:'担心；关心'},{phrase:'as far as ... is concerned',meaning:'就……而言'}],example:'Health is a major concern for many people.\n健康是许多人非常关心的问题。',wordFamily:['concerned','concerning'],memoryTip:'阅读中 concern 既可表示“担忧”，也常表示“涉及”。',aiStatus:'sample'},
  determine:{phonetic:'/dɪˈtɜːrmɪn/',meaning:'v. 决定；确定；查明',examMeaning:'决定；确定',lemma:'determine',partOfSpeech:['v.'],collocations:[{phrase:'determine whether...',meaning:'确定是否……'}],example:'Several factors determine the final result.\n多种因素决定最终结果。',wordFamily:['determined','determination'],memoryTip:'determined 作形容词常表示“坚定的”。',aiStatus:'sample'},
  approach:{phonetic:'/əˈproʊtʃ/',meaning:'n. 方法；途径；v. 接近；处理',examMeaning:'方法；途径；接近',lemma:'approach',partOfSpeech:['n.','v.'],collocations:[{phrase:'an approach to...',meaning:'……的方法/途径'}],example:'We need a different approach to the problem.\n我们需要用不同的方法处理这个问题。',wordFamily:[],memoryTip:'名词表示“方法”时常见 an approach to sth.',aiStatus:'sample'}
};

function loadDB(){
  try{
    let db=JSON.parse(localStorage.getItem(DB_KEY));
    if(!db){
      const old=JSON.parse(localStorage.getItem(OLD_DB_KEY));
      if(old?.words){
        old.words=(old.words||[]).map(w=>({scanAdded:false,sourceSentence:'',sourceParagraph:'',...w}));
        db=old; saveDB(db);
      }
    }
    return db||{words:[],reviews:[]};
  }catch{return{words:[],reviews:[]}}
}
function saveDB(db){localStorage.setItem(DB_KEY,JSON.stringify(db))}
function loadConfig(){
  try{
    return JSON.parse(localStorage.getItem(CONFIG_KEY))||{apiKey:'',apiBase:'https://api.deepseek.com'};
  }catch{return{apiKey:'',apiBase:'https://api.deepseek.com'}}
}
function saveConfig(cfg){localStorage.setItem(CONFIG_KEY,JSON.stringify(cfg))}
function nowISO(){return new Date().toISOString()}
function todayKey(d=new Date()){return d.toLocaleDateString('en-CA')}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}
function statusOf(w){if(w.mastered)return'mastered';if((w.errorCount||0)>=3 && (w.errorCount||0)/Math.max(1,w.reviewCount||0)>=.4)return'stubborn';return'learning'}
function statusLabel(w){return statusOf(w)==='mastered'?'已掌握':statusOf(w)==='stubborn'?'顽固词':'学习中'}
function dueWords(){const db=loadDB(),now=Date.now();return db.words.filter(w=>!w.mastered && new Date(w.nextReviewAt||w.createdAt).getTime()<=now)}
function fmtDate(v){if(!v)return'—';const d=new Date(v);return `${d.getMonth()+1}月${d.getDate()}日`}
function cleanUrl(u){return String(u||'').trim().replace(/\/+$/,'')}
function normalizeWordInput(v){return String(v||'').trim().toLowerCase().replace(/[^a-z'\-]/g,'')}

const SYSTEM_PROMPT_WORD = `你是面向中国高等教育自学考试 00015 英语（二）考生的词汇助手。
用户会提供一个从纸质真题中抄录或点选的英文单词或词形。请识别其词元/原形，并制作简洁、准确、适合应试记忆的词卡。
必须只输出一个合法 JSON 对象，不要输出 Markdown、解释或代码围栏。JSON 必须包含：
{
  "input_word":"用户输入词形",
  "lemma":"词元/原形",
  "phonetic":"IPA 音标",
  "part_of_speech":["n.","v."],
  "core_meaning":"2-4 个常见中文义",
  "exam_meaning":"英语（二）最值得优先记忆的 1-2 个中文义",
  "collocations":[{"phrase":"常见搭配","meaning":"中文含义"}],
  "example":"简短自然英文例句",
  "translation":"例句中文翻译",
  "word_family":["常见同根词"],
  "memory_tip":"一句简短辨析、搭配或记忆提示"
}
要求：不罗列生僻义；输入若为复数、过去式、过去分词、现在分词、比较级等必须还原 lemma；part_of_speech 最多3项；collocations 最多3项；word_family 最多4项；所有中文用简体中文。`;

const SYSTEM_PROMPT_SCAN = `你是英文单词 OCR 识别助手。用户上传的图片可能包含：手写英文单词、印刷体单词、单词表、英语试卷，或者以上内容的混合。
你的任务只有一个：识别图片中清晰可见的英文单词。不要翻译，不要解释，不要输出句子，不要分析题目。
只能输出一个合法 JSON 对象：
{
  "words":["approach","circumstances","effective"]
}
要求：
1. 同时识别手写体和印刷体英文单词。
2. 只输出图片中实际可见且有把握的英文单词，不要猜测或补写看不清的词。
3. 去掉标点、题号、数字和中文；允许英文撇号词和连字符词。
4. 保留图片中的词形，例如 studied、circumstances 不要擅自还原原形；后续词卡模型会自行还原。
5. 大小写不敏感去重，尽量按图片中的阅读/出现顺序排列。
6. 最多返回 150 个唯一单词。
7. 除 JSON 外不要输出任何其他内容。`;

function getDirectConfig(){
  const cfg=loadConfig();
  const apiKey=String(cfg.apiKey||'').trim();
  const apiBase=cleanUrl(cfg.apiBase||'https://api.deepseek.com');
  if(!apiKey) throw new Error('请先在设置中填写 DeepSeek API Key');
  return {apiKey,apiBase};
}

async function deepSeekRequest(payload){
  const {apiKey,apiBase}=getDirectConfig();
  let r;
  try{
    r=await fetch(apiBase+'/chat/completions',{
      method:'POST',
      mode:'cors',
      headers:{
        'Authorization':'Bearer '+apiKey,
        'Content-Type':'application/json'
      },
      body:JSON.stringify(payload)
    });
  }catch(err){
    throw new Error('无法直连 DeepSeek。若网络本身能访问 api.deepseek.com，这通常是浏览器 CORS/网络策略导致：'+(err?.message||'网络错误'));
  }
  let data=null;
  try{data=await r.json()}catch{}
  if(!r.ok) throw new Error(data?.error?.message||`DeepSeek 请求失败（HTTP ${r.status}）`);
  return data;
}

function parseJsonContent(content){
  let text=String(content||'').trim();
  if(text.startsWith('```')) text=text.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');
  try{return JSON.parse(text)}catch{throw new Error('DeepSeek 返回内容不是有效 JSON，请重试')}
}

async function aiEnrichWord(word, source='', sourceSentence=''){
  const key=word.toLowerCase();
  const cfg=loadConfig();
  if(!cfg.apiKey && starterLexicon[key]) return starterLexicon[key];
  const prompt=`请为单词 ${JSON.stringify(key)} 生成英语（二）词卡。${source?`来源：${source}。`:''}${sourceSentence?`真题原句：${sourceSentence}`:''}`;
  const data=await deepSeekRequest({
    model:'deepseek-v4-flash',
    messages:[
      {role:'system',content:SYSTEM_PROMPT_WORD},
      {role:'user',content:prompt}
    ],
    response_format:{type:'json_object'},
    thinking:{type:'disabled'},
    max_tokens:900,
    temperature:0.2
  });
  const c=parseJsonContent(data?.choices?.[0]?.message?.content||'');
  const pos=Array.isArray(c.part_of_speech)?c.part_of_speech.slice(0,3):[];
  const core=String(c.core_meaning||c.exam_meaning||'');
  if(!core) throw new Error('AI 词卡缺少释义，请重试');
  return {
    lemma:c.lemma||key,
    inputWord:c.input_word||key,
    phonetic:c.phonetic||'',
    partOfSpeech:pos,
    meaning:`${pos.length?pos.join(' / ')+' ':''}${core}`.trim(),
    examMeaning:c.exam_meaning||core,
    collocations:Array.isArray(c.collocations)?c.collocations.slice(0,3):[],
    example:[c.example,c.translation].filter(Boolean).join('\n'),
    wordFamily:Array.isArray(c.word_family)?c.word_family.slice(0,4):[],
    memoryTip:c.memory_tip||'',
    aiStatus:'ok',
    aiUpdatedAt:nowISO(),
    aiModel:data?.model||'deepseek-v4-flash'
  };
}

async function scanPaper(imageData, source=''){
  const data=await deepSeekRequest({
    model:'deepseek-v4-flash-vision-exp',
    messages:[
      {role:'system',content:SYSTEM_PROMPT_SCAN},
      {role:'user',content:[
        {type:'text',text:`只识别这张图片里清晰可见的英文单词，并严格输出 JSON。图片可能是手写单词、单词表或英语试卷。${source?`来源备注：${source}`:''}`},
        {type:'image_url',image_url:{url:imageData,detail:'original'}}
      ]}
    ],
    response_format:{type:'json_object'},
    thinking:{type:'disabled'},
    max_tokens:1100,
    temperature:0
  });
  const raw=parseJsonContent(data?.choices?.[0]?.message?.content||'');
  let words=Array.isArray(raw.words)?raw.words:[];
  const seen=new Set();
  words=words
    .map(x=>String(x||'').trim())
    .map(x=>x.replace(/^[^A-Za-z]+|[^A-Za-z'\-]+$/g,''))
    .filter(x=>/^[A-Za-z][A-Za-z'\-]{0,63}$/.test(x))
    .filter(x=>{const k=x.toLowerCase();if(seen.has(k))return false;seen.add(k);return true})
    .slice(0,150);
  return {words};
}

function cloneTpl(id){return document.getElementById(id).content.cloneNode(true)}
function route(name,opts={}){
  currentRoute=name; if(opts.filter)currentFilter=opts.filter;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.route===name));
  if(['detail','settings','scan'].includes(name))document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  render();
}
function render(){app.innerHTML=''; if(currentRoute==='home')renderHome(); if(currentRoute==='add')renderAdd(); if(currentRoute==='scan')renderScan(); if(currentRoute==='words')renderWords(); if(currentRoute==='review')renderReview(); if(currentRoute==='stats')renderStats(); if(currentRoute==='detail')renderDetail(); if(currentRoute==='settings')renderSettings();}

function wordRow(w){
  const div=document.createElement('div');div.className='word-row';div.dataset.id=w.id;
  const subtitle=w.examMeaning||w.meaning||w.sourceSentence||'待 AI 补全';
  div.innerHTML=`<div class="word-main"><strong>${esc(w.word)}${w.lemma&&w.lemma!==w.word?` <span class="ai-tag">→ ${esc(w.lemma)}</span>`:''}${w.scanAdded?` <span class="ai-tag warn">扫描</span>`:''}</strong><small>${esc(subtitle)}</small></div><div class="word-side"><span class="badge">${statusLabel(w)}</span><small class="muted tiny">${fmtDate(w.nextReviewAt)}</small></div>`;
  div.onclick=()=>{selectedWordId=w.id;route('detail')}; return div;
}

function renderHome(){
  pageTitle.textContent='AI 真题单词本'; app.append(cloneTpl('homeTpl')); const db=loadDB(); const due=dueWords().length,today=todayKey();
  document.getElementById('dueCount').textContent=due;
  document.getElementById('todayAdded').textContent=db.words.filter(w=>todayKey(new Date(w.createdAt))===today).length;
  document.getElementById('scannedCount').textContent=db.words.filter(w=>w.scanAdded).length;
  document.getElementById('stubbornCount').textContent=db.words.filter(w=>statusOf(w)==='stubborn').length;
  document.getElementById('masteredCount').textContent=db.words.filter(w=>statusOf(w)==='mastered').length;
  const box=document.getElementById('recentWords'); const recent=[...db.words].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,5);
  if(!recent.length)box.innerHTML='<div class="empty-line">还没有单词，去真题里收第一个吧。</div>'; else recent.forEach(w=>box.append(wordRow(w)));
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>route(b.dataset.go));
  app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>route('words',{filter:b.dataset.filter}));
}

function renderAdd(){
  pageTitle.textContent='快速加词'; app.append(cloneTpl('addTpl')); const db=loadDB();
  const latest=document.getElementById('latestAdded'); const recent=[...db.words].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,8);
  if(!recent.length)latest.innerHTML='<div class="empty-line">输入真题里遇到的陌生词即可。</div>'; else recent.forEach(w=>latest.append(wordRow(w)));
  const form=document.getElementById('quickAddForm'), wordInput=document.getElementById('wordInput'), sourceInput=document.getElementById('sourceInput'), msg=document.getElementById('addMessage');
  setTimeout(()=>wordInput.focus(),50);
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>route(b.dataset.go));
  form.onsubmit=async(e)=>{
    e.preventDefault(); let word=normalizeWordInput(wordInput.value); if(!word)return;
    const source=sourceInput.value.trim();
    const result=await addWordFlow({word,source,sourceSentence:'',scanAdded:false, messageEl:msg});
    if(result.ok){wordInput.value=''; wordInput.focus(); refreshLatestAdded();}
  };
  function refreshLatestAdded(){const db2=loadDB(); latest.innerHTML=''; const rec=[...db2.words].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,8); if(!rec.length)latest.innerHTML='<div class="empty-line">输入真题里遇到的陌生词即可。</div>'; else rec.forEach(w=>latest.append(wordRow(w)));}
}

function renderScan(){
  pageTitle.textContent='拍照识词'; app.append(cloneTpl('scanTpl'));
  document.getElementById('scanBackBtn').onclick=()=>route('add');
  const sourceInput=document.getElementById('scanSourceInput'); sourceInput.value=scanState.source||'';
  const fileInput=document.getElementById('scanFileInput'); const previewWrap=document.getElementById('scanPreviewWrap'); const preview=document.getElementById('scanPreview'); const statusEl=document.getElementById('scanStatus');
  if(scanState.imageData){preview.src=scanState.imageData; previewWrap.classList.remove('hidden'); statusEl.textContent=scanState.imageName?`已选择图片：${scanState.imageName}`:'已选择图片';}
  if(scanState.result) renderScanResult(scanState.result);

  fileInput.onchange=async(e)=>{
    const f=e.target.files?.[0]; if(!f) return; statusEl.textContent='正在压缩图片…';
    try{
      const data=await fileToCompressedDataURL(f,1600,.84);
      scanState.imageData=data; scanState.imageName=f.name; preview.src=data; previewWrap.classList.remove('hidden'); statusEl.textContent=`已选择图片：${f.name}`;
    }catch(err){statusEl.textContent='图片处理失败：'+err.message;}
  };
  document.getElementById('runScanBtn').onclick=async()=>{
    if(!scanState.imageData){statusEl.textContent='请先拍照或选择一张包含英文单词的图片'; return;}
    scanState.source=sourceInput.value.trim(); const btn=document.getElementById('runScanBtn'); btn.disabled=true; btn.textContent='识别中…'; statusEl.textContent='正在识别图片中的英文单词，请稍候…';
    try{
      const result=await scanPaper(scanState.imageData,scanState.source);
      scanState.result=result; statusEl.textContent=`识别完成，共识别到 ${result.words?.length||0} 个英文单词。点需要记忆的词即可加入。`;
      renderScanResult(result);
    }catch(err){statusEl.textContent='扫描失败：'+err.message;}
    finally{btn.disabled=false; btn.textContent='识别单词';}
  };
}

function renderScanResult(result){
  const wrap=document.getElementById('scanResultWrap');
  const meta=document.getElementById('scanResultMeta');
  const list=document.getElementById('scanWordList');
  if(!wrap||!result)return;
  wrap.classList.remove('hidden');
  list.innerHTML='';
  const words=Array.isArray(result.words)?result.words:[];
  meta.textContent=words.length?`共识别到 ${words.length} 个不同的英文单词。`:'没有识别到清晰的英文单词，可以重新拍近一点或提高光线。';
  const source=String(document.getElementById('scanSourceInput')?.value||scanState.source||'').trim();
  if(!words.length)return;

  const card=document.createElement('div');
  card.className='sentence-card';
  const head=document.createElement('div');
  head.className='sentence-head';
  head.innerHTML='<strong>点击需要记忆的词</strong><span class="muted tiny">手写 / 印刷体均可</span>';
  card.append(head);
  const body=document.createElement('div');
  body.className='sentence-text';
  words.forEach(rawWord=>{
    const btn=document.createElement('button');
    btn.className='scan-word';
    btn.type='button';
    btn.dataset.word=rawWord;
    btn.textContent=rawWord;
    btn.onclick=async()=>{
      const word=normalizeWordInput(rawWord);
      if(!word)return;
      btn.disabled=true;
      const oldText=btn.textContent;
      btn.textContent='加入中…';
      const msgSpan=document.createElement('div');
      msgSpan.className='footnote';
      msgSpan.style.marginTop='8px';
      card.append(msgSpan);
      const res=await addWordFlow({word,source,sourceSentence:'',scanAdded:true,messageEl:msgSpan});
      if(res.ok){
        btn.textContent='✓ '+oldText;
        btn.style.background='#eef7f2';
        btn.style.borderColor='#d7eadf';
      }else{
        btn.textContent=oldText;
        btn.disabled=false;
      }
      setTimeout(()=>{if(msgSpan.isConnected)msgSpan.remove();},2800);
    };
    body.append(btn);
  });
  card.append(body);
  list.append(card);
}

async function addWordFlow({word,source='',sourceSentence='',scanAdded=false,messageEl=null}){
  const db=loadDB();
  const existing=db.words.find(w=>w.word.toLowerCase()===word.toLowerCase());
  if(existing){
    if(source && !existing.source) existing.source=source;
    if(sourceSentence && !existing.sourceSentence) existing.sourceSentence=sourceSentence;
    if(scanAdded) existing.scanAdded=true;
    saveDB(db);
    if(messageEl) messageEl.textContent=`“${word}” 已在单词本里。`;
    return {ok:false, reason:'exists'};
  }
  const t=nowISO();
  const item={id:crypto.randomUUID(),word,lemma:'',phonetic:'',meaning:'正在等待 AI 补全…',examMeaning:'',partOfSpeech:[],collocations:[],example:'',wordFamily:[],memoryTip:'',aiStatus:'loading',aiError:'',note:'',source,sourceSentence,sourceParagraph:'',scanAdded,createdAt:t,firstLearnedAt:t,lastReviewAt:null,nextReviewAt:t,reviewCount:0,errorCount:0,streak:0,ease:2.3,mastered:false};
  db.words.push(item); saveDB(db); if(messageEl) messageEl.textContent=`✓ ${word} 已保存，DeepSeek 正在生成词卡…`;
  try{
    const data=await aiEnrichWord(word,source,sourceSentence);
    const db2=loadDB(); const target=db2.words.find(w=>w.id===item.id); if(target){Object.assign(target,data,{aiError:''}); saveDB(db2);} if(messageEl) messageEl.textContent=`✓ ${word}：AI 词卡已生成`;
    return {ok:true, id:item.id};
  }catch(err){
    const db2=loadDB(); const target=db2.words.find(w=>w.id===item.id); if(target){target.aiStatus='error'; target.aiError=err.message; target.meaning='AI 补全失败，点进详情可重试'; saveDB(db2);} if(messageEl) messageEl.textContent=`⚠ ${word} 已保存，但 AI 补全失败：${err.message}`;
    return {ok:true, id:item.id, warning:err.message};
  }
}

function showReviewCard(){
  const empty=document.getElementById('reviewEmpty'), card=document.getElementById('reviewCard'); const total=reviewQueue.length;
  document.getElementById('reviewProgressText').textContent=`${Math.min(reviewIndex,total)} / ${total}`; document.getElementById('reviewProgressBar').style.width=total?`${reviewIndex/total*100}%`:'0%';
  if(reviewIndex>=total){card.classList.add('hidden'); empty.classList.remove('hidden'); return}
  empty.classList.add('hidden'); card.classList.remove('hidden'); const w=reviewQueue[reviewIndex];
  document.getElementById('reviewWord').textContent=w.word; document.getElementById('reviewPhonetic').textContent=w.phonetic||''; document.getElementById('reviewMeaning').textContent=w.examMeaning?`⭐ ${w.examMeaning}\n${w.meaning||''}`:(w.meaning||'释义待补全'); document.getElementById('reviewExample').textContent=w.example||''; document.getElementById('reviewStatusBadge').textContent=statusLabel(w); document.getElementById('reviewSource').textContent=w.source||'';
  const sourceSentenceEl=document.getElementById('reviewSentence'); if(w.sourceSentence){sourceSentenceEl.textContent='真题原句：'+w.sourceSentence; sourceSentenceEl.classList.remove('hidden');} else sourceSentenceEl.classList.add('hidden');
  const note=document.getElementById('reviewNote'); let noteText=''; if(w.memoryTip)noteText+='💡 '+w.memoryTip; if(w.note)noteText+=(noteText?'\n':'')+'📝 '+w.note; if(noteText){note.textContent=noteText; note.classList.remove('hidden')} else note.classList.add('hidden');
  const ans=document.getElementById('answerArea'), show=document.getElementById('showAnswerBtn'), ratings=document.getElementById('ratingBtns'); ans.classList.add('hidden'); ratings.classList.add('hidden'); show.classList.remove('hidden'); show.onclick=()=>{ans.classList.remove('hidden'); ratings.classList.remove('hidden'); show.classList.add('hidden')};
  document.getElementById('speakBtn').onclick=()=>speak(w.lemma||w.word); ratings.querySelectorAll('button').forEach(b=>b.onclick=()=>rateWord(w.id,b.dataset.rating));
}
function rateWord(id,rating){
  const db=loadDB(),w=db.words.find(x=>x.id===id); if(!w)return; const now=new Date(); w.reviewCount=(w.reviewCount||0)+1; w.lastReviewAt=now.toISOString(); let mins=0;
  if(rating==='again'){w.errorCount=(w.errorCount||0)+1; w.streak=0; mins=10; w.mastered=false}
  if(rating==='hard'){w.streak=Math.max(0,(w.streak||0)); mins=24*60*Math.max(1,Math.round(.7+Math.min(w.streak,4)*.7)); w.mastered=false}
  if(rating==='good'){w.streak=(w.streak||0)+1; mins=24*60*Math.max(1,Math.round([1,3,7,15,30,60][Math.min(w.streak-1,5)])); if(w.streak>=6)w.mastered=true}
  if(rating==='easy'){w.streak=(w.streak||0)+2; mins=24*60*Math.max(3,Math.round([3,7,15,30,60,120][Math.min(w.streak-1,5)])); if(w.streak>=5)w.mastered=true}
  w.nextReviewAt=new Date(now.getTime()+mins*60000).toISOString(); db.reviews.push({id:crypto.randomUUID(),wordId:id,rating,at:now.toISOString()}); saveDB(db); reviewIndex++; showReviewCard();
}

function fileToCompressedDataURL(file,maxSide=1600,quality=.84){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader(); reader.onerror=()=>reject(new Error('无法读取图片')); reader.onload=()=>{const img=new Image(); img.onload=()=>{let {width,height}=img; const scale=Math.min(1,maxSide/Math.max(width,height)); width=Math.round(width*scale); height=Math.round(height*scale); const canvas=document.createElement('canvas'); canvas.width=width; canvas.height=height; const ctx=canvas.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,width,height); ctx.drawImage(img,0,0,width,height); resolve(canvas.toDataURL('image/jpeg',quality));}; img.onerror=()=>reject(new Error('无法解析图片')); img.src=reader.result;}; reader.readAsDataURL(file);
  });
}
